# ============================================================
# Pipeline CI/CD — build Astro, validation puis déploiement automatique sur Vercel
#
# Déclenchement :
#   - à chaque push sur la branche "master" (déploiement en production)
#   - à chaque pull request vers "master" (validation seule, sans déployer)
#
# Étapes :
#   1. validate — construit le site (vérification TypeScript + traductions
#      complètes, puis génération des pages FR et EN dans dist/), vérifie que
#      le HTML est valide et qu'il n'y a pas de liens/images cassés en local
#   2. deploy   — si (et seulement si) la validation réussit, construit et
#      publie le site sur Vercel en production
# ============================================================

name: CI/CD — Validation & Déploiement

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    name: Build + validation (HTML + liens/images)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site (astro check + astro build)
        run: npm run build

      - name: Valider le HTML généré
        # css: false — évite les faux positifs sur oklch()/color-mix() (non reconnus par ce validateur)
        uses: Cyb3r-Jak3/html5validator-action@v7.2.0
        with:
          root: dist
          css: false

      - name: Vérifier les liens et images locaux (hors-ligne, sans dépendre du réseau)
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir : les liens commencent par « / » (ex. /assets/…), résolus depuis dist/
          args: --offline --no-progress --root-dir ${{ github.workspace }}/dist dist
          fail: true

  deploy:
    name: Déploiement Vercel (production)
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer la CLI Vercel
        run: npm install --global vercel@latest

      - name: Lier le projet Vercel (via les secrets ORG_ID / PROJECT_ID)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Construire le site (réglages de vercel.json)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déployer en production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
